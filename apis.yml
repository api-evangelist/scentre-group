aid: scentre-group

name: Scentre Group

description: Scentre Group owns and operates 42 Westfield destinations in Australia and New Zealand,
  with the stated purpose of "creating extraordinary places and experiences that connect, enrich and
  are essential to our communities". The group was established in 2014 and offers business solutions
  for brands and retailers reaching Westfield customers, including the Westfield Marketing Hub at
  partner.scentregroup.com. It also publishes investor, sustainability and newsroom information. Surfaced
  via the API Evangelist harvest backlog (source australia-apidays-2026). No public API, developer portal
  or API documentation was found on its sites.

